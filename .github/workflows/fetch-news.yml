name: Fetch Taiwan News

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Commit if updated
        run: |
          git config user.name "NewsBot"
          git config user.email "newsbot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (
            git commit -m "📰 $(date -u '+%Y-%m-%d %H:%M UTC')" &&
            git push &&
            curl -s "https://purge.jsdelivr.net/gh/MichaelLi1976/testnews@master/news.json" > /dev/null &&
            echo "jsDelivr cache purged"
          )
