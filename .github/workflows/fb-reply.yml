name: FB Auto Reply Comments

on:
  workflow_dispatch:    # 由 Pabbly 觸發（每 N 分鐘）

permissions:
  contents: write       # 需要提交 replied-comments.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 自動回覆留言
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
        run: node scripts/fb-reply.js

      - name: 提交回覆記錄
        run: |
          git config user.name "ReplyBot"
          git config user.email "replybot@users.noreply.github.com"
          git add replied-comments.json
          if git diff --staged --quiet; then
            echo "No new replies — nothing to commit"
            exit 0
          fi
          git commit -m "💬 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin master --quiet && git push && break
            echo "Push retry $i..."; sleep 3
          done
          curl -s "https://purge.jsdelivr.net/gh/MichaelLi1976/testnews@master/replied-comments.json" > /dev/null
          echo "CDN cache purged"
